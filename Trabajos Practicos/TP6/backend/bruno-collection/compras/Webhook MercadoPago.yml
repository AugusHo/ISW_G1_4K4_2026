info:
  name: Webhook MercadoPago
  type: http
  seq: 3

http:
  method: POST
  url: http://{{URL_BASE}}/api/compras/webhook
  body:
    type: json
    data: |
      {
        "action": "payment.updated",
        "api_version": "v1",
        "data": { "id": "123456789" },
        "date_created": "2026-06-01T10:00:00.000-04:00",
        "id": 987654321,
        "live_mode": false,
        "type": "payment",
        "user_id": "USER_ID_MP"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: ✅ 200 Successful response
    request:
      url: http://{{URL_BASE}}/api/compras/webhook
      method: POST
      body:
        type: json
        data: |
          {
            "action": "payment.updated",
            "api_version": "v1",
            "data": { "id": "123456789" },
            "date_created": "2026-06-01T10:00:00.000-04:00",
            "id": 987654321,
            "live_mode": false,
            "type": "payment",
            "user_id": "USER_ID_MP"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: x-powered-by
          value: Express
        - name: access-control-allow-origin
          value: "*"
        - name: content-type
          value: text/plain; charset=utf-8
        - name: content-length
          value: "2"
        - name: etag
          value: W/"2-nOO9QiTIwXgNtWtBJezz8kv3SLc"
        - name: date
          value: Sun, 31 May 2026 20:50:05 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: text
        data: OK
