info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: http://{{URL_BASE}}/api/health
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: ✅ 200 Successful response
    request:
      url: http://{{URL_BASE}}/api/health
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: x-powered-by
          value: Express
        - name: access-control-allow-origin
          value: "*"
        - name: content-type
          value: application/json; charset=utf-8
        - name: content-length
          value: "11"
        - name: etag
          value: W/"b-Ai2R8hgEarLmHKwesT1qcY913ys"
        - name: date
          value: Sun, 31 May 2026 20:35:33 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            "ok": true
          }
