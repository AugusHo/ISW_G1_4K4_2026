          value: application/json; charset=utf-8
        - name: content-length
          value: "75"
        - name: etag
          value: W/"4b-VoDzB2KwdSlO1Q7XFgoxhrRFsls"
        - name: date
          value: Sun, 31 May 2026 20:25:42 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            "id": 1,
            "email": "visitante@ecoharmony.com",
            "nombre": "Visitante EcoHarmony"
