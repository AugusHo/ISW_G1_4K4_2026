info:
  name: Get Tipos Ticket
  type: http
  seq: 1

http:
  method: GET
  url: http://{{URL_BASE}}/api/tipos-ticket
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: ✅ 200 Successful response
    request:
      url: http://{{URL_BASE}}/api/tipos-ticket
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: x-powered-by
          value: Express
        - name: access-control-allow-origin
          value: "*"
        - name: content-type
          value: application/json; charset=utf-8
        - name: content-length
          value: "182"
        - name: etag
          value: W/"b6-wVLlirGSBLLb+gJmdt8R2K+GHkE"
        - name: date
          value: Sun, 31 May 2026 20:26:12 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "nombre": "VIP",
              "pase": "VIP",
              "precio": 20000,
              "descripcion": "Acceso prioritario"
            },
            {
              "id": 2,
              "nombre": "Regular",
              "pase": "regular",
              "precio": 10000,
              "descripcion": "Entrada estándar"
            }
          ]
