<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoHarmony Park — Comprar Entradas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    screens: { xs: '400px' },
    fontFamily: { inter: ['Inter','sans-serif'], poppins: ['Poppins','sans-serif'], mono: ['JetBrains Mono','monospace'] }
  } }
};
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  :root {
    --p5:#10b981; --p6:#059669; --p4:#34d399; --a5:#84cc16; --a6:#4d9a16;
    --screen-bg:#f7fbf8;
    --stage-bg:#eef5f0;
  }
  .dark { --screen-bg:#0c1411; --stage-bg:#070d0b; }
  html, body { margin:0; height:100%; }
  body {
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    background:var(--stage-bg); color:#1e293b;
    transition:background .4s;
  }
  .font-poppins { font-family:'Poppins',sans-serif; }
  .font-mono { font-family:'JetBrains Mono',monospace; }

  .app-stage {
    position:relative; min-height:100dvh; width:100%;
    display:grid; place-items:center; padding:16px; overflow:hidden;
  }

  /* aurora */
  .aurora { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .aurora .blob { position:absolute; border-radius:50%; filter:blur(110px); opacity:.5; }
  .dark .aurora .blob { opacity:.32; }
  .aurora .b1 { width:60%; height:60%; top:-15%; left:-10%; background:radial-gradient(circle,var(--p5),transparent 65%); animation:fl1 26s ease-in-out infinite; }
  .aurora .b2 { width:55%; height:60%; top:10%; right:-15%; background:radial-gradient(circle,var(--a5),transparent 65%); animation:fl2 30s ease-in-out infinite; }
  .aurora .b3 { width:55%; height:55%; bottom:-18%; left:18%; background:radial-gradient(circle,var(--p4),transparent 68%); animation:fl3 24s ease-in-out infinite; }
  @keyframes fl1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,24px) scale(1.08)} }
  @keyframes fl2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-26px,18px) scale(.94)} }
  @keyframes fl3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(22px,-22px) scale(1.06)} }

  /* phone-less screen surface */
  .screen {
    position:relative; z-index:1;
    width:min(392px, 100%);
    height:min(calc(100dvh - 32px), 868px);
    display:flex; flex-direction:column;
    background:var(--screen-bg);
    border-radius:34px; overflow:hidden;
    border:1px solid rgba(6,78,59,0.08);
    box-shadow:0 40px 90px -30px rgba(6,78,59,0.45), 0 0 0 1px rgba(255,255,255,0.5) inset;
    transition:background .4s;
  }
  .dark .screen { border-color:rgba(255,255,255,0.07); box-shadow:0 40px 90px -30px rgba(0,0,0,0.8); }

  .screen main::-webkit-scrollbar { width:0; }
  .screen main { scrollbar-width:none; }

  @media (prefers-reduced-motion: reduce) { *{animation-duration:.01ms!important} }
  @media (max-width:430px){ .app-stage{padding:0} .screen{ width:100%; height:100dvh; border-radius:0; border:none; } }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/screens.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
